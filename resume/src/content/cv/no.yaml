main:
    - type: text
      title: Om meg
      body: >-
          Student ved GET Academy. Undervisning er ferdig, og jeg trenger en praksisplass for
          å fullføre fagskolen. Jeg bygger hele løsninger fra database til
          grensesnitt, med vekt på tilgangsstyring, testing og universell utforming.
          Ser etter praksisplass eller juniorstilling innen webutvikling.

    - type: entries
      title: Prosjekter
      items:
          - title: Office & Off
            status: i utvikling
            subtitle: Medgründer og utvikler · nettbutikk for klær
            description: >-
                Nettbutikk jeg bygger sammen med to medgründere. Jeg har ansvaret for
                det tekniske: butikkfronten, backend og betaling, pluss oppsett for
                deploy og backup.
            tech:
                [TanStack Start, Medusa v2, Stripe, PostgreSQL, Railway, Resend]

          - title: Grønt Lys
            status: i utvikling (demo ved forespørsel)
            subtitle: SaaS for faglige ledere ved trafikkskoler · utvikler alene
            description: >-
                Hver skole er isolert med RLS i PostgreSQL. Fire roller med
                egne tilganger, tofaktor, og en revisjonslogg der rader er append-only.
                Bakgrunnsjobber sender e-post og sletter data etter
                faste regler (GDPR).
            tech:
                [
                    TanStack Start,
                    PostgreSQL,
                    Drizzle,
                    Graphile Worker,
                    Better Auth,
                    Playwright + axe,
                ]

          - title: spot
            links:
                - href: https://spot.haugestol.com
                  label: spot.haugestol.com
            subtitle: Delt tegnebrett i sanntid, inspirert av r/place
            description: >-
                Mange tegner samtidig på ett lerret, og ser
                hverandres pekere i realtime. Strøk sendes over WebSockets, valideres og
                rate-limites på serveren, og lagres i ruter i SQLite. Klienten henter bare
                rutene som vises, og serveren rydder bort strøk som er helt skjult.
            tech: [React, Socket.IO, Express, SQLite, Canvas, Docker]

          - title: Wastescope
            links:
                - href: https://ws.haugestol.com
                  label: ws.haugestol.com
                - href: https://www.npmjs.com/package/txcategorizer
                  label: "npm: txcategorizer"

            subtitle: Dashboard for personlig økonomi
            description: >-
                Last opp en eksport fra DNB eller Valle, så blir transaksjonene
                kategorisert og du ser hvor pengene går. Parsingen ligger i txcategorizer,
                mitt eget TypeScript-bibliotek publisert på npm.
            tech: [Drizzle ORM, Better Auth, Recharts, txcategorizer]

    - type: entries
      title: Arbeidserfaring
      items:
          - title: Arbeidspraksis, IT og media
            period:
                start: 2024
                end: 2025
            subtitle: Bragd Utvikling
            description: >-
                Holdt teknologikurs for kollegaer og bidro med medieproduksjon og
                drift av Google Workspace.

          - title: Miljøarbeider
            period:
                start: 2022
                end: 2023
            subtitle: Østre Toten kommune
            description: >-
                Tilrettelegging og oppfølging av brukere med spesielle behov, i tett
                samarbeid med kollegaer og pårørende.

          - title: Salgs- og servicemedarbeider
            period:
                start: 2020
                end: 2022
            subtitle: KIWI
            description: Kundeservice, kasse og varehåndtering i en travel butikk.
