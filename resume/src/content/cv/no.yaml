main:
    - type: text
      title: Om meg
      body: >-
          Fullstack-utvikler under utdanning ved GET Academy. Liker best å bygge
          hele løsninger, fra database til grensesnitt, og få dem ut i bruk. Ser
          etter praksisplass eller juniorstilling innen webutvikling.

    - type: entries
      title: Prosjekter
      items:
          - title: Office & Off
            status: i utvikling
            subtitle: Medgründer og utvikler · nettbutikk for klær
            description: >-
                Nettbutikk jeg bygger sammen med to medgründere. Jeg har ansvaret for
                det tekniske: butikkfronten, backend og betaling, pluss oppsett for
                deploy og backup.
            tech:
                [TanStack Start, Medusa v2, Stripe, PostgreSQL, Railway, Resend]

          - title: Grønt Lys
            status: i utvikling
            subtitle: SaaS for faglige ledere ved trafikkskoler
            description: >-
                Hjelper faglig leder med å holde oversikt over lærerne, oppfølgingen
                og dokumentasjonen regelverket krever.
            tech:
                [
                    TanStack Start,
                    PostgreSQL,
                    Graphile Worker,
                    Vitest,
                    Playwright + axe,
                ]

          - title: Wastescope
            link:
                href: https://ws.haugestol.com
                label: ws.haugestol.com
            subtitle: Dashboard for personlig økonomi med eget bibliotek for parsing
            description: >-
                Last opp en eksport fra banken, så blir alt kategorisert og du ser hvor
                pengene går. Parsingen gjøres av txcategorizer, mitt eget bibliotek på
                npm.
            tech: [Neon, Drizzle ORM, Better Auth, Recharts]

          - title: Pokédex
            link:
                href: https://pokemon.haugestol.com
                label: pokemon.haugestol.com
            subtitle: Læringsprosjekt
            description: >-
                Full Pokédex bygget på PokéAPI. Henter og cacher data på forhånd. Laget
                for å lære mer om bruk av API-er og UI/UX.
            tech: [TanStack Query / Router, Tailwind CSS, Radix UI, Zod]

    - type: entries
      title: Arbeidserfaring
      items:
          - title: Arbeidspraksis, IT og media
            period:
                start: 2024
                end: 2025
            subtitle: Bragd Utvikling
            description: >-
                Her begynte jeg å programmere. Startet med Python og laget en app i
                Django, før jeg gikk over til React, med veiledning fra en utvikler.
                Holdt teknologikurs for kollegaer og bidro med medieproduksjon og
                drift av Google Workspace.

          - title: Miljøarbeider
            period:
                start: 2022
                end: 2023
            subtitle: Østre Toten kommune
            description: >-
                Tilrettelegging og oppfølging av brukere med spesielle behov, i tett
                samarbeid med kollegaer og pårørende.

          - title: Salgs- og servicemedarbeider
            period:
                start: 2020
                end: 2022
            subtitle: KIWI
            description: Kundeservice, kasse og varehåndtering i en travel butikk.
